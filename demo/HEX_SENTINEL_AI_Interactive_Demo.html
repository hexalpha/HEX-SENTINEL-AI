<style>*{box-sizing:border-box}
:root{--base:#0d0e14;--rail:#101117;--surface:#15161e;--panel:#191a24;--line:#2a2b37;--text:#f2f0f5;--muted:#a4a3b4;--quiet:#858699;--red:#f26488;--crimson:#d93866;--purple:#ad9df8;--green:#79dbc0;--amber:#f6bc7f;--radius:15px;--mono:"Cascadia Code","Consolas",monospace;--sans:"Segoe UI",system-ui,sans-serif}
html{background:var(--base);color:var(--text);font:15px/1.55 var(--sans);scrollbar-color:#343543 #11121a}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{outline-offset:4px}
:focus-visible{outline:2px solid var(--purple)}
button{cursor:pointer}
a{color:var(--purple)}
button:disabled{opacity:.5;cursor:wait}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.22;letter-spacing:-.035em}
p{color:var(--muted)}
strong{font-weight:650}
.mono,code{font-family:var(--mono);word-break:break-word}
.muted{color:var(--muted)} .quiet{color:var(--quiet)} .red{color:var(--red)} .green{color:var(--green)}
.small{font-size:.81rem}.break{overflow-wrap:anywhere}.hidden{display:none!important}
.skip{position:fixed;top:-70px;left:12px;padding:9px 16px;background:#161621;z-index:9}.skip:focus{top:12px}
.shell{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto;border-right:1px solid #242531;background:var(--rail);padding:22px 14px 14px;z-index:3}
.brand{display:flex;align-items:center;gap:10px;padding:1px 8px 25px;text-decoration:none;color:var(--text)}
.brandmark{display:grid;place-items:center;flex:0 0 35px;height:35px;background:linear-gradient(148deg,#ed5f84,#9e2349);clip-path:polygon(50% 0,93% 23%,93% 77%,50% 100%,7% 77%,7% 23%);font:700 20px var(--mono);color:#fff5fb}
.brand strong{font-size:.88rem;letter-spacing:.065em;display:block;white-space:nowrap}
.brand small{display:block;color:#ad9ab4;font:10px var(--mono);letter-spacing:.12em;margin-top:3px}
.nav-label{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#85869b;margin:13px 11px 5px}
.nav-item{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:7px 10px;margin:2px 0;border:1px solid transparent;border-radius:8px;background:none;font-size:.83rem;color:#b8b8c7;white-space:nowrap}
.nav-item:hover{background:#20212a;color:#fff}.nav-item[aria-current=page]{background:#2b1b2a;border-color:#4b263c;color:#ffb5c7}
.nav-icon{display:grid;place-items:center;width:18px;color:#a6a3ba;font:16px var(--mono);line-height:1}
.nav-item[aria-current=page] .nav-icon{color:var(--red)}
.rail-footer{margin-top:auto;padding:14px 8px 2px}
.status-tile{border:1px solid #2d2d3a;padding:9px;border-radius:10px;background:#151620}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 11px #6dd6b67d;vertical-align:1px}
.stage{min-width:0}.topbar{height:67px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 30px;border-bottom:1px solid #23242e;background:#11121a;position:sticky;top:0;z-index:2}
.crumb{color:var(--muted);font-size:.86rem}.crumb b{color:var(--text);font-weight:600;margin-left:8px}
.top-right,.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top-right{flex-wrap:nowrap}
kbd{font:10px var(--mono);padding:3px 5px;border:1px solid #404153;border-radius:4px;color:var(--muted);white-space:nowrap}
.btn{border-radius:8px;background:#1b1c27;border:1px solid #353644;padding:8px 13px;font-weight:600;font-size:.84rem;line-height:1.2;min-height:36px;color:var(--text);white-space:nowrap}
.btn:hover{background:#292a39}.btn.primary{background:#b92f56;border-color:#e05479;color:white;box-shadow:0 4px 17px #b3235335}.btn.primary:hover{background:#d03760}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}.btn.ghost:hover{background:#20212c;color:var(--text)}
.search-button{min-width:186px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#c4c2cf}.menu-button{display:none}
.pill{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:3px 8px;border-radius:5px;font:600 10px var(--mono);letter-spacing:.045em;text-transform:uppercase;background:#242432;color:#bdbbce;border:1px solid #39394c}
.pill.demo,.pill.critical{color:#ffabc2;background:#331e30;border-color:#5a2d49}.pill.high{color:#ffba91;background:#36252a;border-color:#5c3738}
.pill.moderate{color:#f8d78d;background:#302b25;border-color:#504331}.pill.low,.pill.live{color:#9debd6;background:#1b302e;border-color:#2c514a}
main{padding:29px 30px 39px;max-width:1680px;margin:auto;min-height:calc(100vh - 67px)}
.hero{position:relative;overflow:hidden;min-height:244px;border-radius:var(--radius);border:1px solid #473044;
  background:radial-gradient(ellipse at 73% 18%,#4c203b66,transparent 65%),linear-gradient(110deg,#191722 45%,#231929 100%);display:grid;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#e090c80b 1px,transparent 1px),linear-gradient(90deg,#e090c80b 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(90deg,transparent 15%,black 72%);pointer-events:none}
.hero-content{position:relative;z-index:1;width:65%;padding:25px 29px}
.kicker{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:11px}
.hero h1{font-size:clamp(2.1rem,4vw,3.7rem);letter-spacing:-.058em;margin-bottom:9px}
.hero p{max-width:420px;font-size:1rem;margin-bottom:17px}
.hero-art{position:absolute;inset:0 0 0 auto;width:57%;height:100%;pointer-events:none}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:21px;flex-wrap:wrap}
.heading h1{font-size:clamp(2rem,3.5vw,3rem);margin:2px 0 4px}.heading p{max-width:720px}
.case-field{min-width:220px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:15px 0}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:left;min-width:0}
button.metric:hover{border-color:#a4526e;background:#1e1a27}
.metric small{color:var(--muted);font-size:.81rem;display:flex;justify-content:space-between;gap:6px}.metric strong{display:block;font-size:1.9rem;letter-spacing:-.055em;margin:1px 0 2px}
.metric span.detail{color:var(--quiet);font:10px var(--mono);text-transform:uppercase;letter-spacing:.07em}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:15px;align-items:start;margin-bottom:15px}
.grid.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.stack{display:grid;gap:15px}.full{grid-column:1/-1}
.panel{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);padding:16px 18px;min-width:0}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.panel h2{font-size:1.15rem;font-weight:680}.panel h3{font-size:1rem}.panel p + p{margin-top:5px}
.chart-layout{display:flex;align-items:center;gap:18px}.donut{flex:0 0 98px;height:98px;border-radius:50%;background:conic-gradient(var(--red) 0 33%,var(--purple) 33% 66%,var(--green) 66%);display:grid;place-items:center}
.donut-inner{display:grid;place-content:center;text-align:center;background:var(--surface);border-radius:50%;width:72px;height:72px;line-height:1.15}
.donut-inner b{font-size:1.45rem}.donut-inner small{font:9px var(--mono);color:var(--muted);text-transform:uppercase}
.legend{display:grid;gap:5px;flex:1}.legend button{display:flex;align-items:center;gap:7px;background:none;color:var(--muted);border:0;padding:1px;text-align:left;font-size:.82rem}
.legend button:hover{color:white}.legend button b{margin-left:auto;color:var(--text)}.swatch{display:inline-block;width:8px;height:8px;border-radius:2px}
.trend{display:flex;justify-content:space-around;gap:10px;align-items:end;height:102px;margin-top:1px;padding:0 4px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 23px,#272833 23px 24px)}
.trend button{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;flex:1;background:none;border:0;padding:0;color:var(--muted);font:10px var(--mono);max-width:64px}
.trend .bar{width:min(29px,75%);height:var(--height);border-radius:4px 4px 0 0;background:linear-gradient(#f07195,#85284d);opacity:.8}
.trend button:hover .bar,.trend button.active .bar{opacity:1;box-shadow:0 0 14px #f15b8277}
.trend button span:last-child{padding:3px 0}
.table-scroll{overflow:auto;max-width:100%}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.83rem}
th{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--quiet);background:#181923}
td,th{padding:9px 10px;border-bottom:1px solid #292a35;vertical-align:middle}
tbody tr:last-child td{border-bottom:0} tbody tr:hover{background:#1b1b27}
td .btn{min-height:28px;padding:4px 7px}.table-link{background:none;border:0;color:#f2eff7;text-align:left;padding:0;font-weight:650}.table-link:hover{text-decoration:underline}
.event-list,.item-list{display:grid;gap:8px}.item{border:1px solid #30313e;border-radius:8px;padding:9px 11px;background:#191a24;overflow-wrap:anywhere}
.item .meta{font:10px var(--mono);color:var(--quiet);margin-top:4px}.item strong{display:block}
.field{display:grid;gap:5px;margin-bottom:11px;min-width:0}
label,.label{color:#d8d6e1;font-size:.82rem;font-weight:600}
input:not([type=checkbox]),select,textarea{width:100%;padding:8px 10px;background:#101119;border:1px solid #393a49;border-radius:8px;color:var(--text)}
input::placeholder,textarea::placeholder{color:#9695a7}textarea{resize:vertical;min-height:107px}
.form-note{font-size:.82rem;margin:9px 0}.banner{padding:10px 12px;border-radius:8px;border:1px solid #634159;background:#281c2d;color:#f1c7d7;font-size:.83rem;margin-bottom:13px}
.banner.error{border-color:#8b3b52}.status-text{min-height:1.2em;color:var(--muted);font-size:.82rem;margin-top:8px}
.split-field{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 12px}
.chip{padding:5px 8px;background:#242532;color:#bfc0d1;border:1px solid #363749;border-radius:6px;font-size:.77rem;overflow-wrap:anywhere;max-width:100%}
pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;background:#101119;border:1px solid #30313e;border-radius:8px;color:#d3c6e7;margin:8px 0;font:12px/1.5 var(--mono)}
.risk-lead{display:flex;align-items:center;gap:16px;padding-bottom:10px}.score{font-size:2.8rem;font-weight:750;letter-spacing:-.08em;line-height:1}.score small{font-size:1.1rem;color:var(--quiet);letter-spacing:-.05em;margin-left:5px}
.scale{height:7px;border-radius:999px;background:#2e2937;margin:6px 0 13px;overflow:hidden}.scale span{display:block;height:100%;background:linear-gradient(90deg,#cab0ff,#e65483);border-radius:inherit}
.term{display:grid;grid-template-columns:minmax(95px,1fr) minmax(0,2.4fr);gap:8px;border-bottom:1px solid #2b2c38;padding:6px 0;font-size:.82rem}.term span:first-child{color:var(--muted)}.term span:last-child{overflow-wrap:anywhere}
.graph-frame{position:relative;border-radius:9px;border:1px solid #3c344a;background:radial-gradient(ellipse at 50% 55%,#27213c,#10111a 68%);overflow:hidden}
.graph-frame canvas{display:block;width:100%;height:300px;touch-action:pan-y}.graph-frame.drag canvas{cursor:grab;touch-action:none}
.graph-frame.drag canvas:active{cursor:grabbing}.graph-help{padding:8px 11px;color:var(--muted);font-size:.78rem;background:#191925}
.empty{padding:19px;border:1px dashed #414353;border-radius:8px;color:var(--muted);text-align:center}
.login{max-width:510px;margin:60px auto 0}.login .panel{padding:24px}.login h1{font-size:2.35rem;margin-bottom:9px}.login p{margin-bottom:16px}
dialog{width:min(92vw,590px);background:#171824;color:var(--text);border:1px solid #50435b;border-radius:14px;padding:18px;box-shadow:0 20px 90px #030305}
dialog::backdrop{background:#05060ac9}dialog .nav-item{display:flex}.search-results{max-height:50vh;overflow:auto}.search-results button span:last-child{overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;z-index:8;right:17px;bottom:17px;max-width:min(440px,90vw);background:#322538;color:#f7e3f0;border:1px solid #63475f;padding:10px 15px;border-radius:9px;display:none;box-shadow:0 8px 25px #07070aa0}#toast.visible{display:block}
@media(max-width:1090px){.shell{grid-template-columns:198px minmax(0,1fr)}.rail{padding-inline:9px}.topbar{padding-inline:20px}main{padding-inline:20px}.hero-content{width:69%}.chart-layout{gap:10px}}
@media(max-width:820px){.shell{display:block}.rail{display:none;position:fixed;top:0;width:min(245px,83vw);box-shadow:0 0 70px #000b}.rail.open{display:flex}.menu-button{display:inline-block}.topbar{padding-inline:12px;height:59px}.crumb{display:none}main{padding:17px 12px}.grid{grid-template-columns:1fr}.grid.equal{grid-template-columns:1fr}.hero-content{width:76%;padding:19px}.hero-art{opacity:.62}.hero{min-height:210px}.kpis{gap:7px}.metric{padding:8px}.metric strong{font-size:1.45rem}.metric small{font-size:.71rem}.metric span.detail{font-size:8px}}
@media(max-width:490px){.search-button{min-width:0}.search-button kbd{display:none}.top-right{gap:4px}.top-right>.pill{display:none}.hero-content{width:100%}.hero-art{opacity:.3;width:80%}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split-field{grid-template-columns:1fr}.panel{padding:13px}.heading{margin-bottom:13px}.case-field{width:100%}.login{margin:24px auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.hero{border-color:#644359;background:radial-gradient(ellipse at 78% 24%,#67224378,transparent 63%),linear-gradient(112deg,#171722 24%,#321b31 100%)}
.panel{box-shadow:0 8px 24px #05060a40;background:linear-gradient(149deg,#191923,#14151c)}
.rail{background:linear-gradient(166deg,#11121a,#0f1017 68%)}
.nav-item{min-height:29px;padding-block:5px;transition:background-color .15s,border-color .15s,color .15s}
.nav-item[aria-current=page]{border-left-color:#f26488}
.metric-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.metric-mini .metric{padding:7px 9px;background:#1a1a26}
.metric-mini .metric strong{font-size:1.45rem;line-height:1.4}
.relationship-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.relationship-flow>span:not(.chip){color:var(--red)}
.check-stack{display:flex;flex-wrap:wrap;gap:4px 13px;margin:7px 0 12px}
.check-stack label{display:inline-flex;align-items:center;gap:5px}
.divider{border:none;border-top:1px solid var(--line);margin:14px 0}
.snapshot{display:block;max-width:100%;border:1px solid #4e4058;border-radius:8px;margin-bottom:8px}

</style>

<script>"use strict";

const finding = (rule_id,group,title,weight,snippet,evidence_ref,kind="heuristic",confidence="medium") =>
  ({rule_id,group,title,weight:Math.max(0,Math.min(100,Math.trunc(HEX_CONFIG.weights[rule_id]??weight))),snippet,evidence_ref,kind,confidence});
const level = score => HEX_CONFIG.bands.find(([,minimum])=>score>=minimum)?.[0]||"Low";

function digest(text) {
  if (!globalThis.crypto?.subtle) return Promise.resolve(null);
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(text)).then(bytes=>
    Array.from(new Uint8Array(bytes),n=>n.toString(16).padStart(2,"0")).join(""));
}

function extract(text,id) {
  const patterns = [
    ["url",/https?:\/\/[^\s<>"'，।]+/gi,value=>value.replace(/[.,;:!?)}\]]+$/,"")],
    ["email",/[\w.+%-]+@[a-z\d-]+(?:\.[a-z\d-]+)+/gi,value=>value.toLowerCase()],
    ["upi_candidate",/(?<![\w@.])[a-z\d][a-z\d._-]{1,63}@[a-z][a-z\d]{1,29}(?![\w-]|\.[a-z\d])/gi,value=>value.toLowerCase()],
    ["phone",/(?<![\w.+])(?:\+91[- ]?|0)?[6-9](?:[- ]?\d){9}(?!\w|\.\d)/g,value=>"+91"+value.replace(/\D/g,"").slice(-10)],
  ];
  return unique(patterns.flatMap(([type,pattern,canonical])=>[...text.matchAll(pattern)].map(match=>
    indicator(type,canonical(match[0]),id,match[0]))), item=>item.type+item.value).slice(0,100);
}

function inspectLink(raw,id) {
  if (/[\s\\\x00-\x1f\x7f]/.test(raw.trim())) throw Error("Enter a single HTTP(S) URL or domain.");
  const url = new URL(raw.includes("://") ? raw.trim() : "https://"+raw.trim());
  const host = url.hostname.toLowerCase().replace(/\.$/,"");
  if (!["https:","http:"].includes(url.protocol) || (!host.includes(".") && !host.includes(":"))) {
    throw Error("Enter a single HTTP(S) URL or domain.");
  }
  const result = [];
  const ip = /^\d+(?:\.\d+){3}$/.test(host) || host.includes(":");
  if (url.username) result.push(finding("URL-01","host","URL contains deceptive user information",24,raw,id));
  if (ip) result.push(finding("URL-02","host","Link uses a literal IP address",16,host,id));
  if (host.includes("xn--")) result.push(finding("URL-03","host","Internationalised hostname needs visual comparison",12,host,id));
  if (/verify|kyc|login|secure|support|payment|update/.test(host)) result.push(finding("URL-04","host","Hostname contains an account or service keyword",12,host,id));
  if (/\/(?:verify|kyc|login|otp|payment|wallet|deposit)(?:[/.\-]|$)/i.test(url.pathname)) result.push(finding("URL-05","link_intent","Path suggests account, credential or payment activity",12,url.pathname,id));
  if (url.protocol==="http:") result.push(finding("URL-06","transport","Submitted URL uses HTTP",8,raw,id,"observation","high"));
  return {details:{host,scheme:url.protocol.slice(0,-1),path:url.pathname,port:url.port,query_keys:[...url.searchParams.keys()],
    store_link:["play.google.com","apps.apple.com"].includes(host)},
    indicators:[indicator("url",raw.trim().includes("://")?raw.trim():url.href,id),indicator(ip?"ip":"domain",host,id)],findings:result};
}

function analyzeOffline(kind,text,id,fixture=null) {
  let findings = [], indicators = [], details = {}, contradictions = [];
  if (kind==="apk") {
    if (!fixture) throw Error("Offline APK mode uses the included synthetic manifest.");
    const sensitive = fixture.permissions.filter(value=>!value.endsWith(".INTERNET"));
    details = {...fixture,sensitive_permissions:sensitive,signature_verification:"Fixture only"};
    indicators = [indicator("package",fixture.package,id),...extract(fixture.links.join(" "),id),
      indicator("domain","wallet-review.example",id)];
    findings = sensitive.map(permission=>finding("APK-01","app_permissions","Application requests a sensitive permission",18,
      permission,id,"observation","high"));
    if (sensitive.length>=3) findings.push(finding("APK-02","app_permissions","Application requests multiple sensitive permissions",30,
      sensitive.join(", "),id,"observation","high"));
  } else if (["website","url","app_store"].includes(kind)) {
    ({details,indicators,findings} = inspectLink(text,id));
  } else {
    if (kind==="email") {
      const header = text.split(/\r?\n\r?\n/)[0];
      for (const line of header.split(/\r?\n/)) {
        const match = line.match(/^(From|Reply-To|Return-Path|Subject|Authentication-Results):\s*(.*)$/i);
        if (match) details[match[1].toLowerCase()] = match[2];
      }
      const domain = (value)=>value?.match(/@([a-z0-9.-]+)/i)?.[1]?.toLowerCase();
      for (const key of ["reply-to","return-path"]) {
        if (domain(details[key]) && domain(details.from) && domain(details[key])!==domain(details.from)) {
          findings.push(finding("EML-"+key.toUpperCase(),"mail_alignment",key+" domain differs from From",15,details[key],id,"observation","high"));
        }
      }
      if (/(?:spf|dkim|dmarc)\s*=\s*(?:fail|softfail)\b/i.test(details["authentication-results"])) {
        findings.push(finding("EML-AUTH","mail_auth","Submitted authentication header reports a failure",12,details["authentication-results"],id));
      }
      if (/(?:spf|dkim|dmarc)\s*=\s*pass\b/i.test(details["authentication-results"])) {
        contradictions.push("A pass result appears in the supplied header. Its provenance is unverified.");
      }
    }
    indicators = extract(text,id);
    for (const [rule,group,title,weight,expression] of HEX_CONFIG.message_rules) {
      const match = text.match(new RegExp(expression,"i"));
      if (match) findings.push(finding(rule,group,title,weight,match[0],id));
    }
    for (const item of indicators.filter(entry=>entry.type==="url").slice(0,30)) {
      try {
        const link = inspectLink(item.value,id);
        indicators.push(...link.indicators);
        findings.push(...link.findings);
      } catch { /* The exact submitted string stays available as an extracted indicator. */ }
    }
  }
  const byGroup = new Map();
  for (const item of findings) {
    if(!item.weight)continue;
    if (!byGroup.has(item.group) || byGroup.get(item.group).weight<item.weight) byGroup.set(item.group,item);
  }
  const contributions = [...byGroup.values()].sort((a,b)=>b.weight-a.weight || a.rule_id.localeCompare(b.rule_id));
  const raw_total = contributions.reduce((sum,item)=>sum+item.weight,0);
  const score = Math.min(100,raw_total);
  const missing = kind==="apk" ? ["Signing certificate verification","Runtime behaviour","Developer attribution"] :
    ["External reputation","Independent attribution",kind==="email"?"Trusted server authentication":"Live website observations"];
  return {kind,details,status:"complete",version:HEX_CONFIG.version,findings:unique(findings,item=>item.rule_id+item.snippet),
    indicators:unique(indicators,item=>item.type+item.value),risk:{score,band:level(score),contributions,raw_total,
    confidence:contributions.length>=3?"medium":"low",missing,contradictions,updated_at:now(),evidence_ref:id,rule_version:HEX_CONFIG.version}};
}

function detect(text) {
  if (/^(From|Subject|Received|Return-Path|Authentication-Results):/i.test(text.trim()) && text.includes("\n")) return "email";
  try { return inspectLink(text,"").details.store_link ? "app_store" : "url"; } catch { return "message"; }
}

function seedCases() {

    return {...item,synthetic:true,created_at,tags:[item.tag],notes:"",evidence:[{id,kind:item.type,source:item.source,created_at,
      filename:item.type==="apk"?"manifest.fixture.json":item.type==="email"?"mail.fixture.eml":"intake.fixture.txt",
      sha256:null,disposition:"synthetic",text:item.type==="apk"?JSON.stringify(item.apk):item.input,
      analysis:analyzeOffline(item.type,item.input,id,item.apk)}]};

}

function saveFile(content,extension,name) {
  const types={json:"application/json",pdf:"application/pdf",csv:"text/csv",html:"text/html"};
  const blob = content instanceof Blob ? content : new Blob([content],{type:types[extension]||"application/octet-stream"});
  const address = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = address;
  link.download = name+"."+extension;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(address),1500);
}

function makePDF(sections) {
  const lines = [];
  for (const [heading,values] of sections) {
    lines.push({text:heading,head:true});
    for (const value of values) {
      const ascii = String(value).normalize("NFKD").replace(/[^\x20-\x7e]/g," ");
      const wrapped = ascii.match(/.{1,93}(?:\s|$)|.{1,93}/g) || [""];
      wrapped.forEach(text=>lines.push({text,head:false}));
    }
    lines.push({text:"",head:false});
  }
  const pages = [];
  const pdfText = value=>String(value).replace(/[\\()]/g,"\\$&");
  for (let i=0;i<lines.length;i+=45) {
    const body = lines.slice(i,i+45).map(({text,head},index)=>
      "BT /F1 "+(head?"12":"9")+" Tf "+(head?"0.58 0.12 0.26":"0.16 0.17 0.21")+
      " rg 44 "+(735-index*14)+" Td ("+pdfText(text)+") Tj ET").join("\n");
    pages.push("0.08 0.08 0.11 rg 0 758 595 84 re f\nBT /F1 20 Tf 1 1 1 rg 44 794 Td (HEX SENTINEL AI) Tj ET\n"+
      "BT /F1 9 Tf 1 1 1 rg 44 777 Td (OFFLINE INVESTIGATION DEMONSTRATION) Tj ET\n"+body+
      "\nBT /F1 9 Tf 0.5 0.3 0.37 rg 44 34 Td (DEMO ONLY  /  "+(pages.length+1)+") Tj ET");
  }
  const objects = ["<< /Type /Catalog /Pages 2 0 R >>","", "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"];
  const keys=[];
  for (const body of pages) {
    const index=objects.length+1;
    keys.push(index+" 0 R");
    objects.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents "+(index+1)+" 0 R >>",
      "<< /Length "+body.length+" >>\nstream\n"+body+"\nendstream");
  }
  objects[1]="<< /Type /Pages /Kids ["+keys.join(" ")+"] /Count "+pages.length+" >>";
  let result="%PDF-1.4\n", offsets=[0];
  objects.forEach((object,i)=>{offsets.push(result.length);result+=(i+1)+" 0 obj\n"+object+"\nendobj\n";});
  const xref=result.length;
  return result+"xref\n0 "+offsets.length+"\n0000000000 65535 f \n"+
    offsets.slice(1).map(n=>String(n).padStart(10,"0")+" 00000 n \n").join("")+
    "trailer\n<< /Root 1 0 R /Size "+offsets.length+" >>\nstartxref\n"+xref+"\n%%EOF\n";
}

<script>"use strict";

const entityColors={url:"#ad9df8",domain:"#f57096",ip:"#7acaed",email:"#a8a5fd",upi_candidate:"#f8bb79",phone:"#7ae0bd",package:"#b0d3fc",case:"#f692ad"};
const hexPath=(context,x,y,radius)=>{
  context.beginPath();
  for(let i=0;i<6;i++){
    const radians=(i*60-30)*Math.PI/180;
    const px=x+radius*Math.cos(radians),py=y+radius*Math.sin(radians);
    if(!i)context.moveTo(px,py);else context.lineTo(px,py);
  }
  context.closePath();
};
function canvasContext(canvas) {
  const width=canvas.clientWidth,height=canvas.clientHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=width*dpr;
  canvas.height=height*dpr;
  const context=canvas.getContext("2d");
  context.scale(dpr,dpr);
  return {context,width,height};
}
function cameraArt(canvas) {
  if (!canvas) return;
  const paint=()=>{
    const {context:c,width:w,height:h}=canvasContext(canvas);
    const x=w*.62,y=h*.51,r=Math.min(72,h*.29),glow=c.createRadialGradient(x,y,3,x,y,r*1.9);
    glow.addColorStop(0,"#ed6d9560");glow.addColorStop(1,"#eb689200");
    c.fillStyle=glow;c.fillRect(0,0,w,h);
    for (const [i,alpha] of [1.43,1.2,1,.8,.6].map((radii,i)=>[radii,[.14,.3,.7,.34,.48][i]])) {
      hexPath(c,x,y,r*i);c.strokeStyle="rgba(241,117,160,"+alpha+")";c.lineWidth=1;c.stroke();
    }
    const nodes=[[.18,.29],[.36,.18],[.45,.75],[.87,.25],[.91,.71],[.71,.9],[.18,.75],[.99,.44],[.66,.07]];
    for(const [i,[nx,ny]] of nodes.entries()){
      const px=w*nx,py=h*ny;
      const a=(i*60-30)*Math.PI/180;
      c.beginPath();c.moveTo(px,py);c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));
      c.strokeStyle=i%2?"#8c5376aa":"#ab79936e";c.stroke();
      c.beginPath();c.arc(px,py,i%3===0?4:2.5,0,Math.PI*2);c.fillStyle=i%2?"#eda0b8":"#c496e1";c.fill();
    }
    c.strokeStyle="#fe9cb8";c.lineWidth=2.2;c.lineCap="round";
    c.beginPath();c.moveTo(x-18,y-15);c.lineTo(x-18,y+15);c.moveTo(x+18,y-15);c.lineTo(x+18,y+15);
    c.moveTo(x-18,y);c.lineTo(x+18,y);c.stroke();
  };
  paint();
  observeCanvas(canvas,paint);
}
function observeCanvas(canvas,paint) {
  if (!("ResizeObserver" in window)) return;
  const observer=new ResizeObserver(()=>{
    if(canvas.isConnected) paint(); else observer.disconnect();
  });
  observer.observe(canvas);
}
function paintLocations(canvas,records) {
  if(!canvas)return;
  const cityPositions={Bikaner:[.29,.23],Jaipur:[.73,.41],Ajmer:[.57,.61],Jodhpur:[.26,.72],Kota:[.76,.83]};
  const counts=new Map();
  for(const entry of records) {
    if(entry.synthetic&&cityPositions[entry.region])counts.set(entry.region,(counts.get(entry.region)||0)+1);
  }
  const paint=()=>{
    const {context:c,width:w,height:h}=canvasContext(canvas);
    c.fillStyle="#10111b";c.fillRect(0,0,w,h);
    c.strokeStyle="#2c2b3c";c.lineWidth=1;
    for(let i=0;i<w;i+=25){c.beginPath();c.moveTo(i,0);c.lineTo(i,h);c.stroke();}
    for(let i=0;i<h;i+=25){c.beginPath();c.moveTo(0,i);c.lineTo(w,i);c.stroke();}
    for(const [city,count] of counts) {
      const [a,b]=cityPositions[city],x=w*a,y=h*b;
      const gradient=c.createRadialGradient(x,y,1,x,y,16+9*count);
      gradient.addColorStop(0,"#e95c91cc");gradient.addColorStop(1,"#e95c9100");
      c.fillStyle=gradient;c.fillRect(x-36,y-36,72,72);
      c.fillStyle="#ffb1ce";c.beginPath();c.arc(x,y,3+count,0,Math.PI*2);c.fill();
      c.fillStyle="#f1dce9";c.font="11px Segoe UI";
      c.textAlign=a>.62?"right":"left";c.fillText(city+" · "+count,x+(a>.62?-7:7),y-7);
    }
  };
  paint();
  observeCanvas(canvas,paint);
}
function drawGraph(canvas,data,mode,onSelect) {
  if (!canvas) return;
  let angle=.45,tilt=.3,selected=null,pointer=null,positions=[],moved=false;
  let zoom=1,panX=0,panY=0,panMode=false;
  const nodes=data.nodes.slice(0,32);
  const related=data.related_cases.slice(0,8);
  function paint(){
    const {context:c,width:w,height:h}=canvasContext(canvas),cx=w*.5+panX,cy=h*.5+panY;
    const radius=Math.min(w*.32,h*.39)*zoom;
    positions=nodes.map((node,index)=>{
      const t=index*2.3999632;
      if(mode==="2d"){
        const a=index*2*Math.PI/Math.max(1,nodes.length)-Math.PI/2;
        return {node,x:cx+Math.cos(a)*radius*1.3,y:cy+Math.sin(a)*radius,z:0};
      }

      const horizontal=Math.sqrt(1-initialY*initialY),x=Math.cos(t+angle)*horizontal,
        z=Math.sin(t+angle)*horizontal,y=initialY*Math.cos(tilt)-z*Math.sin(tilt),
        depth=initialY*Math.sin(tilt)+z*Math.cos(tilt),scale=1+.29*depth;
      return {node,x:cx+x*radius*scale*1.4,y:cy+y*radius*scale,z:depth};

    c.strokeStyle="#45405b";c.lineWidth=1;
    for(const p of positions){
      c.beginPath();c.moveTo(cx,cy);c.lineTo(p.x,p.y);c.stroke();
    }
    related.forEach((caseId,i)=>{

      for (const pos of positions.filter(pos=>data.edges.some(edge=>edge.case_id===caseId&&edge.id===pos.node.id))){
        c.beginPath();c.moveTo(x,y);c.lineTo(pos.x,pos.y);c.strokeStyle="#87657462";c.stroke();
      }

      c.fillStyle="#d4b5c8";c.font="9px Consolas";c.fillText(caseId,x+8,y-5);
    });
    hexPath(c,cx,cy,16);c.fillStyle="#9e365e";c.fill();c.strokeStyle="#ffa8ca";c.stroke();
    c.fillStyle="#fff";c.font="bold 11px Consolas";c.textAlign="center";c.fillText("HEX",cx,cy+4);c.textAlign="left";
    for(const {node,x,y,z} of [...positions].sort((a,b)=>a.z-b.z)){
      c.beginPath();c.arc(x,y,node.id===selected?8:5+z*1.3,0,Math.PI*2);
      c.fillStyle=entityColors[node.type]||"#c7c6da";c.fill();
      if(node.id===selected||((mode==="2d"||nodes.length<7)&&nodes.length<15)){
        c.fillStyle="#e7daed";c.font="10px Consolas";
        const text=node.value.length>27?node.value.slice(0,25)+"…":node.value;
        c.textAlign=x>cx?"right":"left";c.fillText(text,x+(x>cx?-7:7),y-8);c.textAlign="left";

    if(Math.abs(dx)+Math.abs(dy)<2)return;
    moved=true;
    if(panMode||event.shiftKey||mode==="2d"){panX+=dx;panY+=dy;}
    else{angle+=dx*.012;tilt+=dy*.009;}
    pointer={x:event.clientX,y:event.clientY};paint();
  });
  canvas.addEventListener("pointerup",event=>{
    pointer=null;
    if(moved)return;
    const box=canvas.getBoundingClientRect(),x=event.clientX-box.left,y=event.clientY-box.top;
    const node=positions.find(pos=>Math.hypot(pos.x-x,pos.y-y)<13)?.node;
    if(node){selected=node.id;paint();onSelect(node.id);}
  });
  canvas.addEventListener("pointercancel",()=>{pointer=null;});
  paint();
  observeCanvas(canvas,paint);
  const focus=id=>{selected=id;paint();};
  focus.camera=action=>{
    if(action==="in")zoom=Math.min(2.3,zoom*1.24);
    if(action==="out")zoom=Math.max(.45,zoom/1.24);
    if(action==="pan"){
      panMode=!panMode;
      $("#pan-toggle")?.setAttribute("aria-pressed",String(panMode));
    }
    if(action==="reset"){zoom=1;panX=0;panY=0;angle=.45;tilt=.3;panMode=false;$("#pan-toggle")?.setAttribute("aria-pressed","false");}
    paint();
  };
  return focus;
}

</script>
<script>"use strict";
function globeDisplay(canvas,cases) {
  if(!canvas)return null;
  const places={Jaipur:[26.91,75.79],Ajmer:[26.45,74.64],Jodhpur:[26.24,73.02],Kota:[25.21,75.86],Bikaner:[28.02,73.31]};
  const counts=cases.filter(row=>row.synthetic&&places[row.region]).reduce((map,row)=>
    map.set(row.region,(map.get(row.region)||0)+1),new Map());
  const continents=[
    [[66,-165],[73,-137],[70,-105],[80,-81],[69,-55],[55,-59],[46,-50],[29,-79],[17,-89],[9,-80],[5,-78],[15,-97],[29,-115],[49,-125],[59,-143],[66,-165]],
    [[11,-74],[5,-51],[-7,-35],[-24,-43],[-40,-59],[-55,-69],[-46,-76],[-25,-70],[-5,-82],[11,-74]],
    [[71,-11],[78,28],[71,60],[75,111],[66,169],[54,164],[40,142],[22,132],[11,106],[2,100],[17,84],[8,76],[21,64],[27,56],[35,41],[45,33],[36,13],[37,-10],[50,-5],[60,-6],[71,-11]],
    [[35,-11],[35,17],[25,33],[12,50],[-12,41],[-35,19],[-28,10],[-7,7],[4,-16],[20,-17],[35,-11]],
    [[-12,129],[-16,143],[-33,153],[-40,145],[-34,116],[-23,114],[-12,129]],
    [[83,-51],[78,-22],[60,-42],[67,-56],[83,-51]]
  ];
  let lon=68,lat=21,zoom=1,drag=null;
  const radians=value=>value*Math.PI/180;
  function paint(){
    const {context:c,width:w,height:h}=canvasContext(canvas),cx=w/2,cy=h/2,r=Math.min(w,h)*.42*zoom;
    const p=radians(lat);
    const project=(north,east)=>{
      const latitude=radians(north),longitude=radians(east-lon);
      return {x:cx+r*Math.cos(latitude)*Math.sin(longitude),
        y:cy-r*(Math.cos(p)*Math.sin(latitude)-Math.sin(p)*Math.cos(latitude)*Math.cos(longitude)),
        visible:Math.sin(p)*Math.sin(latitude)+Math.cos(p)*Math.cos(latitude)*Math.cos(longitude)>=0};
    };
    const line=points=>{
      let visible=false;c.beginPath();
      for(const [north,east] of points){
        const node=project(north,east);
        if(node.visible){if(visible)c.lineTo(node.x,node.y);else c.moveTo(node.x,node.y);}
        visible=node.visible;
      }
      c.stroke();
    };
    const glow=c.createRadialGradient(cx-r*.25,cy-r*.35,r*.1,cx,cy,r);
    glow.addColorStop(0,"#302242");glow.addColorStop(1,"#121320");
    c.fillStyle=glow;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();
    c.save();c.clip();
    c.strokeStyle="#74577f62";c.lineWidth=1;
    for(let meridian=-180;meridian<180;meridian+=20)line(Array.from({length:37},(_,i)=>[i*5-90,meridian]));
    for(let parallel=-80;parallel<=80;parallel+=20)line(Array.from({length:73},(_,i)=>[parallel,i*5-180]));
    c.strokeStyle="#937ca9c1";c.lineWidth=1.8;
    for(const chain of continents)line(chain);
    const dots=[];
    for(const [name,count] of counts) {
      const node=project(...places[name]);
      if(node.visible)dots.push({node,name,count});
    }
    dots.forEach(({node,count})=>{
      const {x,y}=node;
      c.beginPath();c.arc(x,y,3+count,0,Math.PI*2);c.fillStyle="#ff8aad";c.shadowColor="#ff638a";c.shadowBlur=15;c.fill();c.shadowBlur=0;
    });
    c.restore();
    c.strokeStyle="#b091c6";c.lineWidth=1.1;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
    if(dots.length){
      const sample=dots.find(row=>row.name==="Jaipur")||dots.at(-1);
      c.fillStyle="#ffd3e1";c.font="600 12px Segoe UI";
      c.fillText("Rajasthan fixtures",Math.min(w-115,sample.node.x+10),sample.node.y-10);
    }
  }
  canvas.addEventListener("pointerdown",event=>{drag=[event.clientX,event.clientY];canvas.setPointerCapture(event.pointerId);});
  canvas.addEventListener("pointermove",event=>{
    if(!drag)return;
    lon-=(event.clientX-drag[0])*.46;
    lat=Math.min(80,Math.max(-80,lat+(event.clientY-drag[1])*.35));
    drag=[event.clientX,event.clientY];paint();
  });
  const release=()=>{drag=null;};
  canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);
  paint();observeCanvas(canvas,paint);
  return action=>{
    if(action==="in")zoom=Math.min(2,zoom*1.23);
    if(action==="out")zoom=Math.max(.65,zoom/1.23);
    if(action==="reset"){zoom=1;lat=21;lon=68;}
    paint();
  };
}

</script>

<script>"use strict";
function sandboxView() {

function fixtureReviews(record) {
  if(!record?.reviews)return [];
  const start=Date.parse(record.created_at);
  const complaints=record.reviews.map((text,i)=>({text,stance:"Complaint",published_at:new Date(start+(i===2?1440:i*17)*60000).toISOString()}));
  const positive=record.type==="apk"?"Fast approval and helpful service":record.type==="website"?"Payout credited on time":null;
  return [...complaints,...(positive?[4,9].map(minute=>({text:positive,stance:"Positive",published_at:new Date(start+minute*60000).toISOString()})):[])]
    .map(entry=>({...entry,provenance:"synthetic",corroboration:"none"}));
}

     registrar:"Example Registry Desk",events:{registration:"2026-11-12T05:00:00Z","last changed":"2026-11-18T05:00:00Z",expiration:null},
     domain_age_days:10,nameservers:["ns1.registry.example"],retrieved_at:at,provenance:"synthetic"},
    {kind:"dns",source_record_id:"SRC-DEMO-DNS",source_name:"Fictional resolver",source_url:"https://resolver.example/",value:"192.0.2.44",
     name:host,type:"A",ttl:300,dnssec:"unconfirmed",retrieved_at:at,provenance:"synthetic"},
    {kind:"certificate_transparency",source_record_id:"SRC-DEMO-CT",source_name:"Fictional transparency log",source_url:"https://certs.example/",value:"Illustrative certificate",
     names:["portal."+host],issuer:"Example Demo CA",not_before:"2026-11-13T05:00:00Z",not_after:"2027-02-13T05:00:00Z",
     retrieved_at:at,provenance:"synthetic"}

function offlineMatches(record) {
  if(!record)return [];
  const data=graphData(record);
  const weights={upi_candidate:42,phone:40,package:32,email:28,domain:21,url:22,ip:8};
  const matches=[];
  for(const id of data.related_cases){
    const owned=data.edges.filter(edge=>edge.case_id===record.id),other=data.edges.filter(edge=>edge.case_id===id);
    const groups=new Map();
    for(const edge of owned){
      const linked=other.find(row=>row.id===edge.id);
      if(!linked)continue;
      const signal={...edge,related_evidence_ref:linked.evidence_ref,weight:weights[edge.type]||5};
      const name=edge.type==="url"?"domain":edge.type;
      if(!groups.has(name)||groups.get(name).weight<signal.weight)groups.set(name,signal);
    }
    const signals=[...groups.values()].sort((a,b)=>b.weight-a.weight);
    matches.push({match_id:"CMP-DEMO-"+id.slice(-4),related_case_id:id,title:state.cases.find(row=>row.id===id)?.title||id,
      similarity:Math.min(100,signals.reduce((sum,row)=>sum+row.weight,0)),signals});
  }
  return matches.sort((a,b)=>b.similarity-a.similarity);
}
const caseMatches=record=>offline?offlineMatches(record):(state.matches[record?.id]||[]);

      safe(row.signals.length),btn("Open","open",'data-id="'+safe(row.related_case_id)+'"')])):empty("No eligible historical matches."),

}

<script>"use strict";

function offlineSearch(filters) {
  const query=(filters.q||"").trim().toLowerCase(),kind=filters.kind||"";
  return state.cases.flatMap(record=>{
    const date=record.created_at.slice(0,10);
    if(filters.start&&date<filters.start||filters.end&&date>filters.end)return [];
    const scope={id:record.id,title:record.title,synthetic:record.synthetic,created_at:record.created_at};
    const entries=(record.evidence||[]).flatMap(ev=>[
      {evidence_ref:ev.id,type:"hash",value:ev.sha256||""},
      ...ev.analysis.indicators.map(it=>({evidence_ref:ev.id,type:it.type,value:it.value}))]);
    if(kind==="campaign")return caseMatches(record).filter(row=>!query||
      [row.match_id,row.related_case_id,row.title].join(" ").toLowerCase().includes(query)).map(row=>({...scope,type:kind,value:row.match_id}));
    if(!kind&&[record.id,record.title].join(" ").toLowerCase().includes(query))return [{...scope,type:"case",value:record.title}];
    return entries.filter(row=>(!kind||row.type===kind)&&row.value.toLowerCase().includes(query)).map(row=>({...scope,...row}));
  }).slice(0,50);
}

function active(id) {

function selectRoute(route,{preset=true}={}) {
  return show(route,preset);
}
async function show(route,preset=true,updateHash=true) {
  if(!Object.hasOwn(screens,route))route="overview";
  if(!offline&&!state.role&&route!=="system")route="login";
  if(offline&&preset){
    const types={message:["message","email"],url:["website","url","app_store"],apk:["apk"],apps:["apk"],sandbox:["website"],website:["website"]}[route];
    if(types && selectedCase()?.id?.match(/^HEX-\d{4}$/) && !selectedCase()?.evidence?.some(entry=>types.includes(entry.kind))){
      active(state.cases.find(entry=>entry.evidence?.some(item=>types.includes(item.kind)))?.id||state.active);
    }
  }
  state.route=route;
  const version=++requestVersion;
  if(updateHash && location.hash!=="#"+route) history.pushState(null,"","#"+route);
  paint();
  document.documentElement.scrollTop=0;
  $("#work").focus({preventScroll:true});
  if(!offline&&state.role&&state.active){
    try {
      if(route==="graph"||route==="intelligence"){
        state.graphs[state.active]=await api("/cases/"+state.active+"/graph");
      }else if(route==="audit"){
        state.ledger[state.active]=await api("/cases/"+state.active+"/audit");
      }else if(route==="campaign"){
        state.matches[state.active]=await api("/cases/"+state.active+"/matches");
      }else if(route==="risk"){
        state.risks[state.active]=await api("/cases/"+state.active+"/risk");
      }else if(["osint","assistant","domain","website","apps","reviews","reputation"].includes(route)){
        const id=state.active, collection=await api("/cases/"+id+"/enrichment");
        state.observations[id]=collection;
        if(route==="osint")state.intel[id]=collection.filter(entry=>entry.kind==="osint").at(-1);
        if(route==="assistant")state.explanations[id]=collection.filter(entry=>entry.kind==="explanation").at(-1);
      }else if(route==="history"){
        state.savedSearches=await api("/history/saved");
        await loadStoredHistory();
      }else return;
      if(version===requestVersion)paint();
    }catch(error){touchToast(error.message);}
  }
}
function setEntry(record) {
  const index=state.cases.findIndex(entry=>entry.id===record.id);
  if(index<0)state.cases.unshift(record);
  else state.cases[index]={...state.cases[index],...record};

function graphData(record) {
  if(!record)return {nodes:[],edges:[],related_cases:[]};
  if(!offline)return state.graphs[record.id]||{nodes:[],edges:[],related_cases:[]};
  const signature=entry=>entry.type+" "+entry.value;
  const nodes=unique(record.evidence.flatMap(entry=>entry.analysis.indicators),signature).map((entry,index)=>
    ({id:"demo-"+index,type:entry.type,value:entry.value}));
  const keys=new Map(nodes.map(node=>[signature(node),node.id]));
  const edges=state.cases.flatMap(other=>(other.evidence||[]).flatMap(entry=>entry.analysis.indicators.
    filter(ind=>keys.has(signature(ind))).map(ind=>({...ind,id:keys.get(signature(ind)),case_id:other.id,
    relation:"observed_in",confidence:"direct"}))));
  return {nodes,edges,related_cases:[...new Set(edges.map(edge=>edge.case_id).filter(id=>id!==record.id))]};
}
async function api(path,init={}) {
  const headers=new Headers(init.headers||{});
  if(state.token)headers.set("Authorization","Bearer "+state.token);
  if(init.body&&!(init.body instanceof FormData))headers.set("Content-Type","application/json");
  const response=await fetch("/api"+path,{...init,headers,cache:"no-store"});
  if(!response.ok){
    const out=await response.json().catch(()=>({}));
    const detail=Array.isArray(out.detail)?out.detail.map(entry=>entry.msg).join(". "):out.detail;
    throw Error(detail||"Request failed ("+response.status+").");
  }
  return response.json();
}

    ["Historical case correlations",report.campaign_matches.map(row=>row.match_id+" / "+row.related_case_id+" / "+row.similarity+" of 100 similarity")],

    ["Investigation recommendations",report.recommendations],
    ["Custody demonstration",report.custody.map(entry=>entry.timestamp+" / "+entry.action+" / "+entry.evidence_ref)],

  const selected=state.reportProfile==="technical"?content:content.filter(([label])=>
    !["Sandbox observations","Custody demonstration","Entity relationship evidence","Domain intelligence fixture","Static findings"].includes(label));

<script>"use strict";
async function analyzeSubmission(form,data) {
  const record=selectedCase();
  if(!record)throw Error("Create or select a case before submitting evidence.");
  const route=form.dataset.route;
  if(route==="apk"){
    data.append("case_id",record.id);
    data.set("notes",data.get("evidence-notes")||"");
    const output=await request("/analyze/apk",data);
    setEntry(await api("/cases/"+record.id));
    state.evidence=output.evidence_id;
    paint();
    return output.duplicate?"Duplicate evidence · "+output.evidence_id:"APK retained · "+output.evidence_id;
  }
  const text=String(data.get("analysis-text")||"");
  if(!text.trim())throw Error("Enter text or a URL.");
  const format=data.get("analysis-kind");
  const kind=format==="auto"?detect(text):format;
  if(route==="message"&&!["message","email"].includes(kind))throw Error("Use URL and domain analysis for addresses.");
  if(!offline){
    const output=await request("/analyze/"+(route==="url"&&kind==="website"?"website":route),{
      case_id:record.id,text,kind:route==="url"&&kind==="message"?"auto":kind,source:data.get("source")||"Analyst submission",
      notes:data.get("evidence-notes")||""});
    setEntry(await api("/cases/"+record.id));
    state.evidence=output.evidence_id;
    paint();
    return output.duplicate?"Duplicate evidence · "+output.evidence_id:"Evidence retained · "+output.evidence_id;
  }
  const hash=await digest(text);
  const duplicate=record.evidence.find(entry=>hash?entry.sha256===hash:entry.text===text);
  if(duplicate){state.evidence=duplicate.id;paint();return "Evidence already present · "+duplicate.id;}
  const id="EV-DEMO-"+shortId(), finalKind=route==="url"&&kind==="message"?"url":kind;
  const analysis=analyzeOffline(finalKind,text,id);
  record.evidence.push({id,kind:finalKind,text,sha256:hash,source:"Offline analyst input",filename:finalKind==="email"?"input.eml":"input.txt",
    disposition:"offline demonstration",created_at:now(),analysis});
  state.evidence=id;
  persist();paint();
  return "Offline evidence analysed · "+id;
}
async function saveCase(formId,values){
  const payload={title:values.get("title").trim(),priority:values.get("priority"),notes:values.get("notes"),
    tags:values.get("tags").split(",").map(value=>value.trim().slice(0,40)).filter(Boolean).slice(0,12)};
  if(payload.title.length<3)throw Error("Enter a case title with at least three characters.");
  const editing=formId==="case-edit",current=selectedCase();
  let result;
  if(editing)payload.status=values.get("status");
  else payload.synthetic=offline||values.get("synthetic")==="true";
  if(offline){
    result=editing?{...current,...payload}:{...payload,id:"HEX-DEMO-"+shortId(),status:"Open",created_at:now(),evidence:[]};
    setEntry(result);persist();
  }else{
    result=await request(editing?"/cases/"+current.id:"/cases",payload,editing?"PATCH":"POST");
    setEntry(result);
  }
  await openCase(result.id);
  return editing?"Case updated":"Case created";
}
async function submitForm(form) {
  const data=new FormData(form),record=selectedCase();
  if(form.id==="case-filter"){
    state.query=data.get("case-query");state.caseStage=data.get("case-stage");state.band=data.get("case-band");paint();return;
  }
  if(form.id==="login-form"){
    state.token=data.get("token");
    try{
      state.role=(await api("/session")).role;
      await reloadCases();await show("overview");
      return "Signed in as "+state.role;
    }catch(error){
      state.token="";state.role="";throw error;
    }
  }
  if(form.id==="case-create"||form.id==="case-edit")return saveCase(form.id,data);
  if(form.id==="analyze")return analyzeSubmission(form,data);
  if(form.id==="upload-evidence"){
    if(!record)throw Error("Select a case before uploading evidence.");
    data.set("case_id",record.id);data.set("source",data.get("upload-source"));data.set("notes",data.get("upload-notes"));
    const response=await request("/evidence/upload",data);
    setEntry(await api("/cases/"+record.id));paint();
    return (response.duplicate?"Duplicate evidence · ":"Evidence retained · ")+response.evidence_id;
  }
  if(form.id==="osint-form"){
    if(offline){
      state.osintQuery=data.get("indicator")||"";
      const term=state.osintQuery.trim().toLowerCase();
      const match=term&&state.cases.find(candidate=>[candidate.domain,candidate.title,candidate.tag].some(value=>value?.toLowerCase().includes(term)));
      if(match){const query=state.osintQuery;active(match.id);state.osintQuery=query;}
      paint();return;
    }
    const selection=$("#indicator")?.selectedOptions[0];
    if(!record||!selection)throw Error("Select a case with a domain indicator first.");
    state.intel[record.id]=await request("/osint/search",{case_id:record.id,evidence_id:selection.dataset.ref,indicator:selection.value});
    paint();return "DNS lookup status · "+state.intel[record.id].status;

}
async function handleAction(action,id,control) {
  const record=selectedCase();
  if($("#command").open&&!["search","search-close"].includes(action))$("#command").close();
  switch(action) {
    case "route": return show(id);
    case "open": return openCase(id);
    case "menu": $("#rail").classList.toggle("open");return;
    case "search": return commandSearch();
    case "search-close": return $("#command").close();
    case "day": state.day=state.day===id?"":id;return paint();
    case "filter-risk": state.band=id;state.query="";state.caseStage="";return show("cases");
    case "clear-filters": state.query="";state.band="";state.caseStage="";return paint();
    case "sample-case": return openCase(id,state.route);
    case "fill-sample": {
      const fixture=HEX_DEMO.find(entry=>entry.id===id);
      $("#analysis-text").value=fixture.input;
      $("#analysis-kind").value=fixture.type==="website"?"website":"auto";
      $("#analysis-text").focus();
      return;
    }
    case "graph-mode": state.graphMode=id;paint();$("#work [data-action='graph-mode'][aria-pressed='true']")?.focus();return;
    case "reset-replay": resetReplay();return paint();
    case "play": return playReplay();
    case "explain":
      if(!record)throw Error("Select a case before requesting an explanation.");
      if(offline)state.aiFixture=true;
      else state.explanations[record.id]=await request("/explain",{case_id:record.id,use_local_model:true});
      return paint();
    case "health":
      if(offline){touchToast("Offline workspace ready. Integrations are unavailable.");return;}
      await getHealth();touchToast("System state refreshed.");return;
    case "verify": {
      const result=await api("/evidence/"+id+"/verify");
      touchToast(result.valid?"Original SHA-256 matches the acquisition record.":"Integrity mismatch. Review this evidence item.");
      return;
    }
    case "report":
      if(!record)throw Error("Select a case before exporting.");
      if(offline)exportDemo(record,id);
      else {
        const report=await request("/reports/generate",{case_id:record.id,format:id,profile:state.reportProfile,browser_transport:true});
        if(report.encoding!=="base64"||!report.content)throw Error("The service returned an empty or unsupported report.");
        const bytes=Uint8Array.from(atob(report.content),letter=>letter.charCodeAt(0));
        saveFile(new Blob([bytes],{type:report.media_type}),id,report.filename.replace(/\.(pdf|json|csv|html)$/,""));
      }
      touchToast(id.toUpperCase()+" report downloaded.");return;
    case "demo-login": return show("overview",false);
    case "logout":
      state.token="";state.role="";state.cases=[];state.explanations={};state.graphs={};state.ledger={};state.intel={};
      state.observations={};state.matches={};state.answers={};state.risks={};state.revisions={};state.historyRecords=[];
      state.savedSearches=[];state.historyFilters={q:"",kind:"",start:"",end:""};state.focusedEvidence="";active("");
      return show("login",false);
    default: return advancedAction(action,id,control,record);
  }
}
document.addEventListener("click",async event=>{

<script>"use strict";
async function refreshObservations(record){
  state.observations[record.id]=await api("/cases/"+record.id+"/enrichment");
  if(state.active===record.id)paint();
}
async function loadStoredHistory(offset=0){
  const query=new URLSearchParams({...state.historyFilters,offset:String(offset)});
  for(const [key,value] of [...query])if(!value)query.delete(key);
  const output=await api("/history?"+query);
  state.historyRecords=offset?[...state.historyRecords,...output.records]:output.records;
  state.historyNext=output.next_offset;
}
function assistantFixture(query,language,record){
  const hi=language==="hi"||/[\u0900-\u097f]/.test(query),risk=riskOf(record),score=risk?.score??0;
  const wantsRisk=/risk|score|जोखिम|स्कोर/i.test(query);
  const facts=wantsRisk?(risk?.contributions||[]).map(rule=>"+"+rule.weight+" · "+rule.title):
    (record.evidence||[]).flatMap(ev=>ev.analysis.indicators.map(row=>row.type+" · "+row.value));
  return {summary:hi?(wantsRisk?"इस नमूने का जाँच स्कोर "+score+"/100 है।":"ये पहचानकर्ता काल्पनिक साक्ष्य में मिले हैं।"):
    wantsRisk?"The fixture assessment is "+score+"/100. These rules contribute to the result.":"The case evidence contains the following fixture identifiers.",
    facts,citations:(record.evidence||[]).map(ev=>({evidence_ref:ev.id})),mode:"synthetic workflow"};
}
async function submitAdvanced(form,data,record){
  if(!record&&["domain-query","live-observe","app-identity","listing-query","reviews-import","assistant-question"].includes(form.id))
    throw Error("Select a case first.");

  switch(form.id){
    case "domain-query": {
      const selected=select("domain-host");
      if(!selected?.dataset.ref)throw Error("Choose an observed hostname.");
      await request("/domain/lookup",{case_id,evidence_id:selected.dataset.ref,indicator:selected.value,
        sources:data.getAll("sources"),consent:data.has("consent")});
      await refreshObservations(record);return "Source observations recorded";
    }
    case "live-observe": {
      const selected=select("observe-url");
      if(!selected?.dataset.ref)throw Error("Choose the submitted URL.");
      let result=await request("/website/jobs",{case_id,evidence_id:selected.dataset.ref,consent:data.has("consent")});
      for(let checks=0;checks<75&&["queued","running"].includes(result.status);checks++){
        const status=form.querySelector("[data-form-status]");
        if(status)status.textContent="Document observation · "+result.status;
        await new Promise(resolve=>setTimeout(resolve,1500));

      return (result.duplicate?"Identifier already recorded · ":"App identifier acquired · ")+result.evidence_id;
    }
    case "listing-query": {
      const selected=select("listing-package");
      if(!selected?.dataset.ref)throw Error("Choose an observed Android package.");
      await request("/apps/lookup",{case_id,evidence_id:selected.dataset.ref,indicator:selected.value,consent:data.has("consent")});
      await refreshObservations(record);return "Catalogue lookup recorded";
    }
    case "reviews-import": {
      await request("/reviews/import",{case_id,evidence_id:value("review-evidence"),items:[{source_url:value("review-url"),text:value("review-text"),
        published_at:value("review-date")||null,rating:value("review-rating")?Number(value("review-rating")):null}]});
      await refreshObservations(record);return "Public reference recorded";
    }
    case "assistant-question": {
      const query=value("question"),language=value("answer-language");
      state.answers[case_id]=offline?assistantFixture(query,language,record):await request("/assistant/question",{case_id,query,language});
      paint();return "Cited answer ready";
    }
    case "history-form": {
      state.historyFilters={q:value("history-q"),kind:value("history-kind"),start:value("history-start"),end:value("history-end")};
      if(state.historyFilters.start&&state.historyFilters.end&&state.historyFilters.start>state.historyFilters.end)throw Error("Choose an end date after the start date.");
      if(!offline)await loadStoredHistory();
      paint();return "Historical results ready";
    }
  }
}
async function advancedAction(action,id,control,record){
  switch(action) {
    case "save-history": {
      const {q,kind,start,end}=state.historyFilters,label=q||kind||"All evidence";
      if(offline){
        state.savedSearches.unshift({id:"FIND-DEMO-"+shortId(),label,query:q,filters:{kind,start,end}});
        try{localStorage.setItem("hex-saved-search",JSON.stringify(state.savedSearches.slice(0,30)));}catch{}
      } else {
        const row=await request("/history/saved",{label:(label.length<3?"Query "+label:label).slice(0,60),query:q,kind,start:start||null,end:end||null});
        state.savedSearches.unshift(row);
      }
      paint();touchToast("Search saved");return;
    }
    case "saved-history": {
      const row=state.savedSearches.find(value=>value.id===id);
      if(!row)return;
      state.historyFilters={q:row.query,kind:row.filters.kind,start:row.filters.start||"",end:row.filters.end||""};
      if(!offline)await loadStoredHistory();
      paint();return;
    }
    case "next-history":
      if(state.historyNext!=null){await loadStoredHistory(state.historyNext);paint();}
      return;
    case "evidence-link":
      state.focusedEvidence=id;
      return show("vault",false);
    case "revision-history":
      state.focusedEvidence=id;
      state.revisions[id]=await api("/evidence/"+id+"/history");paint();return;
    case "reanalyze": {
      const result=await request("/evidence/"+id+"/reanalyze",{});
      setEntry(await api("/cases/"+record.id));
      state.revisions[id]=await api("/evidence/"+id+"/history");
      state.focusedEvidence=id;paint();touchToast("Analysis revision "+result.revision+" recorded");return;
    }
    case "globe":
      if(id==="list"){
        $("#globe-locations").setAttribute("tabindex","-1");$("#globe-locations").focus();
      }else globeFocus?.(id);
      return;
    case "graph-camera":
      graphFocus?.camera(id);return;
  }
}
