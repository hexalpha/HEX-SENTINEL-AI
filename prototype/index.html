<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e14">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; connect-src 'self'; img-src 'self' file: data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>HEX SENTINEL AI · Investigation workspace</title>
<link rel="stylesheet" href="./style.css">
<script src="./bootstrap.js" defer></script>
</head>
<body>
<a class="skip" href="#work">Skip to workspace</a>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Investigation navigation"></aside>
  <div class="stage">
    <header class="topbar" id="topbar"></header>
    <main id="work" tabindex="-1" aria-label="Active investigation workspace"></main>
  </div>
</div>
<dialog id="command" aria-label="Workspace search"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Enable JavaScript to use the offline investigation workspace.</noscript>
</body>
</html>
